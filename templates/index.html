<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift & Fuel Profitability Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 780px;
      margin: 36px auto;
      padding: 0 20px;
      background: #f8fafc;
      color: #0f172a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    input {
      padding: 9px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2563eb; margin-left: 8px; }
    .insight-box {
      margin-top: 18px;
      padding: 14px;
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
      white-space: pre-line;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      font-size: 14px;
    }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <h1>Shift & Fuel Profitability Tracker</h1>
  <p>Log shift hours, gross earnings, distance, and fuel spend to track true net hourly pay.</p>

  <div class="grid">
    <input type="date" id="shift_date" />
    <input type="number" step="0.1" id="hours" placeholder="Hours (e.g. 5.5)" />
    <input type="number" step="0.01" id="gross_pay" placeholder="Gross (€)" />
    <input type="number" step="0.1" id="km_driven" placeholder="Distance (km)" />
    <input type="number" step="0.01" id="fuel_cost" placeholder="Fuel Cost (€)" />
  </div>
  <button onclick="addShift()">Log Shift</button>
  <button class="secondary" onclick="runAnalysis()">Analyze Efficiency</button>

  <div id="insight" class="insight-box" style="display:none;"></div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Hours</th>
        <th>Gross</th>
        <th>Fuel</th>
        <th>Net Pay</th>
        <th>Net / Hr</th>
      </tr>
    </thead>
    <tbody id="shiftRows"></tbody>
  </table>

  <script>
    document.getElementById("shift_date").valueAsDate = new Date();

    async function loadShifts() {
      const res = await fetch("/api/shifts");
      const shifts = await res.json();
      const tbody = document.getElementById("shiftRows");
      tbody.innerHTML = shifts.map(s => `
        <tr>
          <td>${s.shift_date}</td>
          <td>${s.hours}h</td>
          <td>€${s.gross_pay.toFixed(2)}</td>
          <td>€${s.fuel_cost.toFixed(2)}</td>
          <td><strong>€${s.net_pay.toFixed(2)}</strong></td>
          <td>€${s.net_hourly.toFixed(2)}/hr</td>
        </tr>
      `).join("");
    }

    async function addShift() {
      const payload = {
        shift_date: document.getElementById("shift_date").value,
        hours: document.getElementById("hours").value,
        gross_pay: document.getElementById("gross_pay").value,
        km_driven: document.getElementById("km_driven").value,
        fuel_cost: document.getElementById("fuel_cost").value,
      };
      const res = await fetch("/api/shifts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json();
        alert(err.error);
        return;
      }
      ["hours", "gross_pay", "km_driven", "fuel_cost"].forEach(id => document.getElementById(id).value = "");
      loadShifts();
    }

    async function runAnalysis() {
      const box = document.getElementById("insight");
      box.style.display = "block";
      box.textContent = "Analyzing shift trends...";
      const res = await fetch("/api/analyze");
      const data = await res.json();
      box.textContent = data.insight;
    }

    loadShifts();
  </script>
</body>
</html>
